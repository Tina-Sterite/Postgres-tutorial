version: '3'

services:
  pgdatabase:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sup3Rus3R
      POSTGRES_DB: dvdrental
    volumes:
      - ./dvdrental_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pgnetwork

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    networks:
      - pgnetwork

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - pgdatabase
    networks:
      - pgnetwork

networks:
  pgnetwork:
    driver: bridge